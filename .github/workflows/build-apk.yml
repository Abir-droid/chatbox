name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Chatbox APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Google Services JSON (if configured in Secrets)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Platform 36 & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release & Debug APKs
        id: build
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_output.txt
          exit ${PIPESTATUS[0]}

      - name: Show Gradle Error on Failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 gradle_output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_output.txt

      - name: Fail If Build Failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: List Generated APKs
        run: find android/ -name "*.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare APKs for GitHub Release
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/release/*.apk release-apks/Chatbox.apk
          cp android/app/build/outputs/apk/debug/*.apk release-apks/Chatbox-Debug.apk
          ls -lh release-apks/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Chatbox Android App' }}
          body: |
            ### 📱 Chatbox Android Release
            
            Install Chatbox directly on your Android phone!
            
            - **Chatbox.apk**: Production Release APK signed with persistent keystore.
            - **Chatbox-Debug.apk**: Debug build with developer logging.
            
            #### Features & Fixes:
            - Real-time messaging, audio/video notes & media sharing
            - High-priority background push notifications for calls and messages
            - Incoming video and audio calls wake the device when closed or locked
            - Front & Rear camera flip button in video calls
            - Draggable mini video preview (PIP) with edge snapping
            - In-place updates without needing to uninstall previous version
          draft: false
          prerelease: false
          files: |
            release-apks/Chatbox.apk
            release-apks/Chatbox-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
