<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- High-contrast rounded squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Modern Chat Bubble with smooth shadow -->
  <g filter="url(#glow)">
    <path fill="url(#bubbleGrad)" d="M48 30.5c0-8.56-8.06-15.5-18-15.5S12 21.94 12 30.5c0 4.88 2.62 9.22 6.74 12.06l-1.92 6.42a1 1 0 0 0 1.28 1.24l7.65-2.88c1.34.42 2.77.66 4.25.66 9.94 0 18-6.94 18-15.5z"/>
  </g>

  <!-- Modern Conversation Waves / Dots inside bubble -->
  <circle cx="23" cy="30.5" r="2.8" fill="#2563eb" />
  <circle cx="30" cy="30.5" r="3.2" fill="#0284c7" />
  <circle cx="37" cy="30.5" r="2.8" fill="#38bdf8" />

  <!-- Vibrant Real-time Active Pulse Dot -->
  <circle cx="49" cy="15" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
</svg>
